name: Build NyxenPlayer
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk NyxenPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NyxenPlayer-apk
          path: NyxenPlayer.apk
          retention-days: 30
