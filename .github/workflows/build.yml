name: Build NyxenPlayer
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Fixed signing key, so the app's SHA-1 never changes (Google sign-in depends on it).
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nyxen.jks"; fi

      - name: Build release APK
        run: gradle assembleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/nyxen.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk NyxenPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NyxenPlayer-apk
          path: NyxenPlayer.apk
          retention-days: 30
